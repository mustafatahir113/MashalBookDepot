<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify Phone - Mashal Book Depot</title>

    <style>

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .card {
            width: 90%;
            max-width: 450px;
            padding: 40px;
            border-radius: 25px;
            background: rgba(255,255,255,.15);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #eee;
        }

        label {
            display: block;
            color: white;
            font-weight: 600;
            margin: 25px 0 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #00d084;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            background: #ffdddd;
            color: #b00000;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: white;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>🔐 Verify OTP</h1>

    <p>
        Enter the 6-digit OTP shown in your Django terminal.
    </p>

    {% if messages %}

        {% for message in messages %}

            <div class="error">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label for="otp">
            Enter OTP
        </label>

        <input
            type="text"
            name="otp"
            id="otp"
            maxlength="6"
            minlength="6"
            placeholder="123456"
            inputmode="numeric"
            required
        >

        <button type="submit">
            Verify & Login
        </button>

    </form>

    <a
        href="{% url 'phone_login' %}"
        class="back"
    >
        ← Request New OTP
    </a>

</div>

</body>

</html>
